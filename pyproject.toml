[project]
name = "aaibina"
dynamic = ["version"]
description = "QueryView: FastAPI + SQLModel backend and React SPA over the ClickHouse HTTP interface"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlmodel>=0.0.16",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "cryptography>=42",
    "aiosqlite>=0.22.1",
    "alembic>=1.13",
    "mcp>=1.9",
    "asyncpg>=0.29",
    "duckdb>=1.0",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/kolodkin/aai-bina"
Repository = "https://github.com/kolodkin/aai-bina"
Issues = "https://github.com/kolodkin/aai-bina/issues"

[project.scripts]
queryview-backend = "queryview.main:run"
aaibina = "queryview.main:run"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-playwright>=0.7",
    "pytest-html>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["e2e"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["backend/queryview"]

# Vite SPA build output. The directory is gitignored and produced by
# `npm run build` — release CI copies frontend/dist there before `uv build`
# so the wheel ships a working /api + SPA out of the box.
[tool.hatch.build]
artifacts = ["backend/queryview/static/**"]
